name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      MEDIA_ASSISTANT_DATA_DIR: data/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for offline checks
        run: python -m pip install 'flask>=3.0' 'playwright>=1.58' 'imageio-ffmpeg>=0.6'
      - name: Check Python syntax
        run: python -m compileall -q app.py core platforms tests scripts
      - name: Check local storage, drafts and publication rules
        run: python -m unittest tests.test_data_retention tests.test_publication tests.test_publishing_workflow tests.test_topic_radar
      - name: Check MatrixMedia with a local mock service
        run: python -m unittest tests.test_matrixmedia
